services:
  - type: web
    name: utc2-dams-api
    runtime: docker
    region: singapore
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/docs
    initialDeployHook: pnpm --filter backend prisma:seed
    envVars:
      - key: NODE_ENV
        value: production
      - key: API_PREFIX
        value: api/v1
      - key: APP_URL
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_ACCESS_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
      - key: DEMO_ADMIN_PASSWORD
        generateValue: true
      - key: DEMO_ACCOUNT_PASSWORD
        generateValue: true
      - key: DEFAULT_INITIAL_PASSWORD
        generateValue: true
      - key: REDIS_URL
        sync: false
      - key: SEED_DEMO_DATA
        sync: false
