# ==============================================================================
# Standalone Docker Compose (Khi chạy độc lập không dùng Global Infra)
# ==============================================================================
name: utc2-thesis-system

networks:
  app-network:
    driver: bridge

services:
  postgres:
    image: postgres:17-alpine
    container_name: utc2_postgres
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - app-network

  redis:
    image: redis:7-alpine
    container_name: utc2_redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT}:6379"
    volumes:
      - redis-data:/data
    networks:
      - app-network

volumes:
  postgres-data:
  redis-data:
