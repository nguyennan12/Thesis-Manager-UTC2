# ==============================================================================
# Standalone Docker Compose (Hệ thống Quản lý Đồ án Tốt nghiệp UTC2)
# Chỉ chạy Database & Caching (PostgreSQL, Redis), Backend & Frontend chạy ngoài bằng pnpm
# ==============================================================================
name: utc2-thesis-system

services:
  postgres:
    image: postgres:17-alpine
    container_name: utc2_postgres
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-utc2_thesis_db}
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-root_password}
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: utc2_redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data

volumes:
  postgres-data:
  redis-data:

